plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.android.gms.oss-licenses-plugin'
    id 'com.chaquo.python'
}

// Optional per-machine Python path for Chaquopy buildPython.
// Set "chaquopy.buildPython" in local.properties (not committed to git).
def localProps = new Properties()
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def buildPythonPath = localProps.getProperty("chaquopy.buildPython")

android {
    namespace 'com.jjewuz.executor'
    compileSdk = 36

    defaultConfig {
        applicationId "com.jjewuz.executor"
        minSdk 29
        targetSdk 36
        versionCode 11
        versionName "1.1"
        python {
            version "3.13"
            if (buildPythonPath != null) {
                buildPython buildPythonPath
            }
            pip {
                install "six"
                install "requests"
                install "numpy"
                install "Pillow"
                install "regex"
                install "lxml"
            }
        }
        ndk {
            abiFilters "arm64-v8a", "x86_64" // Updated to supported ABIs
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures{
        viewBinding true
        buildConfig true
    }
    buildToolsVersion '34.0.0'
}


dependencies {

    dependencies {
        implementation("androidx.core:core-ktx:1.18.0")
        implementation("androidx.appcompat:appcompat:1.7.1")
        implementation("com.google.android.material:material:1.14.0")
        implementation("androidx.constraintlayout:constraintlayout:2.2.1")
        implementation("androidx.activity:activity-ktx:1.13.0")
        implementation("androidx.lifecycle:lifecycle-viewmodel-ktx:2.10.0")
        implementation("androidx.lifecycle:lifecycle-livedata-ktx:2.10.0")
        implementation("androidx.navigation:navigation-fragment-ktx:2.9.8")
        implementation("androidx.navigation:navigation-ui-ktx:2.9.8")
        implementation("androidx.preference:preference-ktx:1.2.1")
        implementation("androidx.coordinatorlayout:coordinatorlayout:1.3.0")
        implementation("androidx.drawerlayout:drawerlayout:1.2.0")
        implementation("androidx.core:core-splashscreen:1.2.0")
        implementation("androidx.work:work-runtime-ktx:2.11.2")
        implementation("androidx.recyclerview:recyclerview:1.4.0")
        implementation("com.google.android.gms:play-services-oss-licenses:17.1.0")
        implementation("io.github.Rosemoe.sora-editor:editor:0.23.6")
        implementation("io.github.Rosemoe.sora-editor:language-textmate:0.23.6")
        coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")

        testImplementation("junit:junit:4.13.2")
        androidTestImplementation("androidx.test.ext:junit:1.3.0")
        androidTestImplementation("androidx.test.espresso:espresso-core:3.7.0")
    }
}